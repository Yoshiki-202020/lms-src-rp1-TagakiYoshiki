<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">
				
				<!-- 備考の入力チェックエラー -->
				<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
					<div class="text-danger"
						th:if="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].note')}"
						th:text="|* #{maxlength('備考', 100)}|"
						style="font-weight: bold;">
					</div>
					
					<div class="text-danger"
						th:if="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingStartTimeHour')}"
						th:text="|*#{input.invalid('出勤時間')}|"
						style="font-weight: bold;">
					</div>
					
					<div class="text-danger"
						th:if="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingEndTimeHour')}"
						th:text="|*#{input.invalid('退勤時間')}|"
						style="font-weight: bold;">
					</div>
					
					<div class="text-danger"
						th:if="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingStartTime')}"
						th:text="|*#{attendance.punchInEmpty}|"
						style="font-weight: bold;">
    </div>
					
				</th:block>
				
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w300">コース内容</th>
							<th class="w70" colspan="3">出勤</th>
							<th class="w70" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w240">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<!--田垣 Task.26 勤怠情報直接変更画面 時、分の追加	-->
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|" class="form-control" 
										th:style="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingStartTime')
    or (#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingStartTimeHour')
    and dailyAttendanceForm.trainingStartTimeHour == null)}
    ? 'border: 2px solid red; background-color: #ffe6e6;' : ''">
										<option th:each="trainingStartTimeHour : ${attendanceForm.attendanceHour}" th:value="${trainingStartTimeHour.key}" class="form-control"
										th:selected="${trainingStartTimeHour.key == dailyAttendanceForm.trainingStartTimeHour}">[[${trainingStartTimeHour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|" class="form-control" 
										th:style="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingStartTime')
    or (#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingStartTimeHour')
    and dailyAttendanceForm.trainingStartTimeMinute == null)}
    ? 'border: 2px solid red; background-color: #ffe6e6;' : ''">
										<option th:each="trainingStartTimeMinute : ${attendanceForm.attendanceMinute}" th:value="${trainingStartTimeMinute.key}" class="form-control"
										th:selected="${trainingStartTimeMinute.key == dailyAttendanceForm.trainingStartTimeMinute}">[[${trainingStartTimeMinute.value}]]</option>
									</select>
								</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
									class="form-control"
									th:style="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingEndTimeHour')
									and dailyAttendanceForm.trainingEndTimeHour == null}
									? 'border: 2px solid red; background-color: #ffe6e6;' : ''">
										<option th:each="trainingEndTimeHour : ${attendanceForm.attendanceHour}" th:value="${trainingEndTimeHour.key}" class="form-control"
										th:selected="${trainingEndTimeHour.key == dailyAttendanceForm.trainingEndTimeHour}">[[${trainingEndTimeHour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|" class="form-control"
										th:style="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].trainingEndTimeHour')
											and dailyAttendanceForm.trainingEndTimeMinute == null}
											? 'border: 2px solid red; background-color: #ffe6e6;' : ''">
										<option th:each="trainingEndTimeMinute : ${attendanceForm.attendanceMinute}" th:value="${trainingEndTimeMinute.key}" class="form-control"
										th:selected="${trainingEndTimeMinute.key == dailyAttendanceForm.trainingEndTimeMinute}">[[${trainingEndTimeMinute.value}]]</option>
									</select>
								</td>
								<!--Task.26はここまで-->
								<td class="w120">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inlne="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control" 
									th:style="${#fields.hasErrors('attendanceForm.attendanceList[' + stat.index + '].note')} ? 'border: 2px solid red; background-color: #ffe6e6;' : ''"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<!--Task.27「更新」ボタン押下時に確認画面を出すのでcomfirmを使用-->
					<!--return使用でキャンセルまたはOKを押すことでreturn falseまたはtrueを返している-->
					<input type="submit" value="更新" name="complete" class="btn btn-info" onclick="return confirm('更新します。よろしいでしょうか？');"/>
				</div>

			</form>
		</div>
	</div>

</body>
</html>
